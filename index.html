<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <title>Generic Exlantix</title>
  <link rel="stylesheet" href="styles.css?v=1.4.3">
</head>
<body>
  <main class="dashboard" aria-label="Generic Exlantix">
    <section class="hero" id="hero" aria-label="Главный экран">
      <div class="hero-shade" aria-hidden="true"></div>
      <header class="hero-topbar">
        <div class="hero-clock">
          <div class="clock" id="clock">10:30</div>
          <div class="date" id="date">25 августа</div>
        </div>
        <nav class="system-actions" aria-label="Системные действия">
          <button type="button" id="wallpaper-button" aria-label="Сменить изображение"><span>◐</span></button>
          <button type="button" id="settings-button" aria-label="Открыть настройки"><span>⚙</span></button>
          <button type="button" id="close-button" aria-label="Закрыть экран"><span>×</span></button>
        </nav>
      </header>

      <div class="hero-bottom">
        <article class="vehicle-status-card">
          <span class="vehicle-ready-dot" aria-hidden="true"></span>
          <div>
            <div class="eyebrow">EXLANTIX</div>
            <strong id="vehicle-status">Готов к поездке</strong>
            <span><b id="outside-temperature">+18°</b> снаружи · <b id="battery-voltage">13.8 V</b></span>
          </div>
        </article>

        <button type="button" class="weather-widget" id="weather-widget" aria-label="Обновить погоду">
          <span class="weather-icon" id="weather-icon" aria-hidden="true">☁</span>
          <span class="weather-copy">
            <span class="eyebrow" id="weather-city">ПОГОДА</span>
            <strong id="weather-temperature">—</strong>
            <span id="weather-condition">Нажмите для обновления</span>
          </span>
          <span class="weather-refresh" aria-hidden="true">↻</span>
        </button>

        <article class="player-widget">
          <div class="album-art" id="album-art" aria-hidden="true"><span>EX</span></div>
          <div class="track-info">
            <div class="eyebrow">СЕЙЧАС ИГРАЕТ</div>
            <strong class="track-title" id="track-title">Музыка не выбрана</strong>
            <span class="track-artist" id="track-artist">JCarTools Media</span>
          </div>
          <div class="player-controls" aria-label="Управление музыкой">
            <button type="button" data-media="MEDIA_BLACK" aria-label="Предыдущий трек">‹</button>
            <button type="button" class="play" data-media="MEDIA_PLAY" aria-label="Воспроизвести">▶</button>
            <button type="button" data-media="MEDIA_NEXT" aria-label="Следующий трек">›</button>
          </div>
        </article>
      </div>
    </section>

    <section class="actions-section" aria-labelledby="actions-title">
      <header class="actions-header">
        <div>
          <div class="eyebrow">БЫСТРЫЙ ДОСТУП</div>
          <h1 id="actions-title">Действия</h1>
        </div>
        <p>Нажмите для запуска · удерживайте, чтобы изменить</p>
      </header>
      <div class="action-slots" id="action-slots" aria-live="polite"></div>
    </section>
  </main>

  <div class="sheet-backdrop" id="picker" hidden>
    <section class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <header class="picker-header">
        <div>
          <div class="eyebrow">НАСТРОЙКА СЛОТА</div>
          <h2 id="picker-title">Выберите действие</h2>
        </div>
        <button type="button" class="picker-close" id="picker-close" aria-label="Закрыть">×</button>
      </header>
      <label class="search-field">
        <span aria-hidden="true">⌕</span>
        <input id="picker-search" type="search" placeholder="Найти действие или приложение" autocomplete="off">
      </label>
      <div class="picker-tabs" role="tablist">
        <button type="button" class="active" data-picker-tab="recommended" role="tab">Рекомендуемые</button>
        <button type="button" data-picker-tab="actions" role="tab">Все действия</button>
        <button type="button" data-picker-tab="splits" role="tab">Комбинации</button>
        <button type="button" data-picker-tab="apps" role="tab">Приложения</button>
      </div>
      <div class="picker-grid" id="picker-grid"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=1.4.3"></script>
</body>
</html>
